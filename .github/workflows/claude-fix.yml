name: Claude auto-fix

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# 帶 label 建立 issue 會**同時**觸發 opened 與 labeled 兩個事件，兩個 run 會並行搶同一張
# issue（實測：一張 issue 跑出兩個 run、各燒一次額度）。同一張 issue 只留最後一個。
concurrency:
  group: claude-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    # Trust model:
    # - The `auto-fix` label can only be applied by users with issues:write
    #   (effectively collaborators / the CI bot), so the label-triggered path
    #   needs no extra guard.
    # - For @claude mentions in issue bodies or comments, gate on
    #   author_association so that random drive-by commenters on a public repo
    #   can't trigger an agent run with contents:write.
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'auto-fix')) ||
      (github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 白名單策略：**逐動詞 allow**（不用 `Bash(git:*)`），deny 只當第二層。
          # 為什麼不能只靠 deny：deny 比對的是字面 Bash 指令字串，所以
          #   * `Bash(python:*)` 可以 `python -c "import os;os.system('git reset --hard')"`
          #     繞掉所有 deny —— 因此 python 收窄到只能跑 pytest；
          #   * `git config core.hooksPath` / `git -c core.hooksPath=…` 會讓後續 git 操作
          #     執行攻擊者放的 hook 腳本；
          #   * `git fetch ext::sh -c '…'` 的 transport helper 直接執行任意指令。
          # 以上三條都已從 allow 移除或明確 deny。本 job 帶 contents/issues/PR 寫入權，
          # 且 prompt 會讀 CI log（比 author_association 把關過的內容更不可信），
          # 所以爆炸半徑要壓到「改檔 + commit + push 分支 + 開 PR + 跑 pytest」為止。
          # （--max-turns 也擋住權限被擋後的無效重試 churn。實測多行 block scalar 的
          #   三個 flag 都會被正確解析。）
          claude_args: |
            --max-turns 50
            --allowed-tools "Read,Glob,Grep,Edit,Write,MultiEdit,TodoWrite,Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git branch:*),Bash(git push:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run:*),Bash(pytest:*),Bash(python -m pytest:*)"
            --disallowed-tools "Bash(git push --force:*),Bash(git push -f:*),Bash(git reset:*),Bash(git clean:*),Bash(git rebase:*),Bash(git filter-branch:*),Bash(git config:*),Bash(git -c:*),Bash(git remote:*),Bash(git submodule:*),Bash(git fetch:*),Bash(gh api:*),Bash(gh secret:*),Bash(gh repo:*)"
          prompt: |
            An auto-fix request was filed in this repository (${{ github.repository }}). Read the triggering issue or comment, including any linked workflow run logs, and identify the root cause of the failure.

            Implement a minimal fix, run `pytest -v` to verify, and open a pull request from a `claude/fix-<short-slug>` branch. Keep the change focused — do not refactor or expand scope beyond what's needed to make CI green.
